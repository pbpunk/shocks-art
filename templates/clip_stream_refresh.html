{% set refresh_status = request.query_params.get('refresh_status') %}
{% set refresh_message = request.query_params.get('refresh_message') %}
<section class="clips-refresh-bar" aria-label="Livestream intake">
  <form method="post" action="{{ url_path(request, '/actions/clips/refresh-streams') }}">
    <button type="submit">Check for new streams</button>
  </form>
  {% if refresh_message %}
    <span class="clips-refresh-message{% if refresh_status == 'error' %} is-error{% endif %}" aria-live="polite">
      {{ refresh_message }}
    </span>
  {% endif %}
</section>
