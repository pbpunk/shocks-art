<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% if (active_runs is defined and active_runs) or (native_active is defined and native_active) %}
      <meta http-equiv="refresh" content="8">
    {% endif %}
    <title>Shocks Art Content System</title>
    <link rel="stylesheet" href="{{ url_path(request, '/static/styles.css?v=analytics-mobile-1') }}">
    {% block head_extra %}{% endblock %}
    <link rel="stylesheet" href="{{ url_path(request, '/static/app_shell.css?v=dvr-shell-1') }}">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="{{ url_path(request, '/') }}">Shocks Art Content System</a>
      <nav>
        <a data-app-tab="clips" href="{{ url_path(request, '/') }}">Clips</a>
        <a data-app-tab="library" href="{{ url_path(request, '/library') }}">Library</a>
        <a data-app-tab="debug" href="{{ url_path(request, '/debug') }}">Debug</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <script src="{{ url_path(request, '/static/tab_swipe.js?v=2') }}" defer></script>
  </body>
</html>
