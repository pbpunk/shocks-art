[project]
name = "shocks-art-content-system"
version = "0.1.0"
description = "Local-first livestream candidate extraction system for Shocks Art."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "jsonschema>=4.22",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "google-api-python-client>=2.137",
  "google-auth>=2.32",
  "google-auth-oauthlib>=1.2",
  "google-genai>=0.3.0",
  "cryptography>=43.0",
]

[project.optional-dependencies]
automation = [
  "playwright>=1.46",
]
test = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
